<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amor a la Mexicana - Cafetería</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="stylesheet" href="Estilos.css">
    <style>
        .social-icons {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .social-icons a {
            margin: 10px 0;
            width: 60px; 
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .social-icons a:hover {
            transform: scale(1.1); 
        }
        .social-icons img {
            width: 40px; 
            height: 40px;
            object-fit: cover;
        }
        #confirmation-message {
            display: none;
            background-color: #28a745;
            color: white;
            padding: 10px;
            margin-top: 20px;
            text-align: center;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <h1>Amor a la Mexicana</h1>
        </div>
    </header>

    <nav>
        <ul>
            <li><a href="Inicio.html">Inicio</a></li>
            <li><a href="Menu.html">Menú</a></li>
            <li><a href="Servicios.html">Servicios</a></li>
        </ul>
    </nav>
    
    <main>
        <section>
            <h2 style="text-align: center;">Contacto</h2>
            <form id="contact-form" action="javascript:void(0);" method="post" style="max-width: 600px; margin: auto;">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required><br>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required><br>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="4" required></textarea><br>

                <button type="submit">Enviar</button>
            </form>

            <div id="confirmation-message">¡Tu mensaje ha sido enviado correctamente!</div>

            <div style="margin-top: 40px; text-align: center;">
                <h3>Ubicación</h3>
                <iframe
                    width="700"
                    height="300"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3760.951318232764!2d-99.17307813423578!3d19.39310487361504!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1ee5eb30a0d71%3A0xe682a4adfa6c7c8a!2sPlaza%20de%20la%20Constituci%C3%B3n%2C%20Centro%2C%2027550%20San%20Luis%20Potos%C3%AD!5e0!3m2!1ses-419!2smx!4v1642169876849!5m2!1ses-419!2smx"
                    frameborder="0" style="border: 2px solid #000;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Amor a la Mexicana. Todos los derechos reservados.</p>
    </footer>

    <div class="social-icons">
        <a href="xxxx" target="_blank">
            <img src="W.png" alt="WhatsApp"> 
        </a>
        <a href="xxxxx" target="_blank">
            <img src="F.png" alt="Facebook"> 
        </a>
        <a href="xxxxx" target="_blank">
            <img src="I.png" alt="Instagram"> 
        </a>
    </div>

    <script>
        // Simulando el envío del formulario
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Evitar el comportamiento por defecto del formulario
            document.getElementById('confirmation-message').style.display = 'block'; // Mostrar el mensaje de confirmación
            document.getElementById('contact-form').reset(); // Limpiar el formulario
        });
    </script>
</body>
</html>
